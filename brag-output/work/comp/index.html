<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Meta brag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  :root { --font: 'Inter', system-ui, sans-serif; --font-display: 'Inter', system-ui, sans-serif; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-feature-settings: 'cv11', 'ss01'; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1400px 900px at 62% 45%, #fbfaf6 0%, var(--bg) 60%, #ece8df 100%); }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }

  /* phone */
  #phone { width: 418px; height: 872px; border-radius: 66px; background: #1d1c1a; padding: 14px;
    box-shadow: 0 0 0 2px #3a3833 inset, 0 40px 80px rgb(40 30 10 / 0.18), 0 12px 24px rgb(40 30 10 / 0.12); transform-origin: 50% 50%; }
  #screenBox { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--bg); transform: translateZ(0); }
  .pscreen { position: absolute; inset: 0; overflow: hidden; background: var(--bg); transform: translateZ(0);
    --safe-top: 50px; --safe-bottom: 30px; }
  .pscreen .scroller { position: absolute; left: 0; top: 0; width: 390px; }
  .pscreen .app { min-height: 844px; }
  .pscreen .intro { min-height: calc(844px - var(--safe-bottom) - 40px); }
  .pscreen .intro.smart-intro .intro-body { padding-bottom: 67px; }
  .pscreen .fab { right: 16px; }
  .pscreen *, .pscreen *::before, .pscreen *::after { animation: none !important; transition: none !important; }
  .pscreen :focus { outline: none; }
  .statusbar { position: absolute; left: 0; right: 0; top: 0; height: 50px; z-index: 60; display: flex; align-items: center;
    justify-content: space-between; padding: 6px 30px 0 46px; background: linear-gradient(var(--bg) 82%, color-mix(in srgb, var(--bg) 0%, transparent)); font: 600 16px/1 'Inter'; color: var(--ink); pointer-events: none; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 35px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 61; }
  .homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 61; }
  .tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 70;
    background: rgb(27 26 23 / 0.22); border: 2px solid rgb(255 255 255 / 0.85); box-shadow: 0 2px 10px rgb(0 0 0 / 0.15); opacity: 0; }
  .ring { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 69; border: 2px solid rgb(27 26 23 / 0.35); opacity: 0; }
  .hl { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent) 22%, transparent) 58%); background-repeat: no-repeat; background-size: 0% 100%; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -0.2em; margin-left: 1px; }

  /* hook */
  .hpill { white-space: nowrap; }
  .hpill .mess-float { animation: none; }
  #messCard { width: 358px; height: 222px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
  #headline { width: 1920px; text-align: center; font: 700 96px/1.06 var(--font-display); letter-spacing: -0.035em; color: var(--ink); }
  #headline .w { display: inline-block; white-space: pre; }
  #headline .accent { color: var(--accent); }

  /* left column */
  .left { left: 150px; width: 760px; }
  .eyebrow2 { font: 650 26px/1 var(--font); color: var(--accent); letter-spacing: 0.01em; margin-bottom: 22px; }
  .cap { font: 700 76px/1.06 var(--font-display); letter-spacing: -0.035em; color: var(--ink); text-wrap: balance; }
  .cap .line { display: block; }
  .sub2 { font: 500 34px/1.3 var(--font); color: var(--ink-2); margin-top: 22px; letter-spacing: -0.01em; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgb(20 40 70 / 0.22); }
  .brand span { font: 750 64px/1 var(--font-display); letter-spacing: -0.035em; }
  .letters { display: flex; gap: 14px; margin-bottom: 18px; }
  .letters .smart-l { width: 96px; height: 96px; font-size: 44px; border-radius: 22px; display: grid; place-items: center; font-weight: 700; }
  .lword { font: 650 30px/1 var(--font); color: var(--ink-2); height: 30px; margin-bottom: 40px; position: relative; }
  .lword span { position: absolute; left: 0; top: 0; white-space: nowrap; }

  /* outro */
  #outro { width: 1920px; text-align: center; top: 0; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #outro img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 16px 40px rgb(20 40 70 / 0.25); }
  #outro .name { font: 750 120px/1 var(--font-display); letter-spacing: -0.04em; margin-top: 44px; }
  #outro .tag { font: 600 54px/1.15 var(--font-display); letter-spacing: -0.03em; color: var(--ink-2); margin-top: 26px; }
  #outro .small2 { font: 550 28px/1 var(--font); color: var(--ink-3); margin-top: 42px; display: flex; gap: 18px; align-items: center; }
  #outro .small2 i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  #outro > * { will-change: transform, opacity; }

  /* vertical 1080×1920 */
  html.v, html.v body { width: 1080px; height: 1920px; }
  html.v #stage { background: radial-gradient(1000px 1400px at 50% 55%, #fbfaf6 0%, var(--bg) 60%, #ece8df 100%); }
  html.v #headline { width: 1080px; font-size: 104px; }
  html.v .left { left: 70px; width: 940px; text-align: center; }
  html.v .brand, html.v .letters { justify-content: center; }
  html.v .lword span { width: 100%; text-align: center; }
  html.v .cap { font-size: 80px; }
  html.v #outro { width: 1080px; height: 1920px; }
  html.v #outro .tag { max-width: 820px; text-wrap: balance; }
  html.v #outro .small2 { font-size: 30px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
</style>
</head>
<body>
<div id="stage">
  <div id="phoneWrap" class="abs"><div id="phone"><div id="screenBox"></div></div></div>
  <div id="messCard" class="abs"></div>
  <div id="pills"></div>
  <div id="headline" class="abs"></div>

  <div id="cap2" class="abs left">
    <div class="brand"><img src="icon.svg" alt=""><span>Smart Meta</span></div>
    <div class="cap"><span class="line">Turn them into</span><span class="line">a weekly plan.</span></div>
  </div>
  <div id="cap3" class="abs left">
    <div class="letters" id="letters"></div>
    <div class="lword" id="lword"></div>
    <div class="cap"><span class="line">Build every goal</span><span class="line">one letter at a time.</span></div>
  </div>
  <div id="cap4" class="abs left">
    <div class="eyebrow2">The R in SMART</div>
    <div class="cap"><span class="line">The reason you wrote</span><span class="line">shows up every day.</span></div>
  </div>
  <div id="cap5" class="abs left">
    <div class="eyebrow2">Once a week</div>
    <div class="cap"><span class="line">Miss a day? Say why.</span><span class="line" style="color:var(--accent)">The review suggests the fix.</span></div>
  </div>
  <div id="outro" class="abs">
    <img src="icon.svg" alt="">
    <div class="name">Smart Meta</div>
    <div class="tag">Goals that survive the moment of decision.</div>
    <div class="small2"><span>Works offline</span><i></i><span>Stays on your phone</span><i></i><span>English &amp; Português</span></div>
  </div>
</div>
<script src="screens.js"></script>
<script src="comp.js"></script>
</body>
</html>
